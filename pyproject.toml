#
# RobotLog2RQM - pyproject.toml
#
# --------------------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools==79.0.1", "wheel", "colorama==0.4.6", "pypandoc_binary==1.15", "PythonExtensionsCollection"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-robotlog2rqm"
version = "1.6.0"
description = "Imports robot result(s) to IBM Rational Quality Manager (RQM)"
authors = [
   {name = "Tran Duy Ngoan", email = "Ngoan.TranDuy@vn.bosch.com"}
]
maintainers = [
   {name = "Tran Duy Ngoan", email = "Ngoan.TranDuy@vn.bosch.com"}
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
   "lxml",
   "requests",
   "colorama",
   "robotframework"
]

[project.urls]
Homepage = "https://github.com/test-fullautomation/robotframework-robotlog2rqm"

[project.scripts]
RobotLog2RQM = "RobotLog2RQM.robotlog2rqm:RobotLog2RQM"
RQMTool = "RobotLog2RQM.rqmtool:RQMTool"

[tool.setuptools]
packages = ["RobotLog2RQM", "RobotLog2RQM.RQM_templates"]

[tool.setuptools.package-data]
RobotLog2RQM = ["RQM_templates/*.xml", "*.pdf"]
